name: presence-soak

# C43: presence-under-claim-load soak. Drives an in-process server with
# simultaneous claim actors and asserts presence never flips (see
# docs/PRESENCE-SOAK.md and tests/presence-claim-soak.test.js). The test
# also runs in the ordinary unit suite; this job is the bounded,
# separately-scheduled soak shape with tunable load.
on:
  schedule:
    # Weekly bounded soak: Mondays 09:40 UTC (offset from soak-test.yml).
    - cron: "40 9 * * 1"
  workflow_dispatch:
    inputs:
      actors:
        description: "Simultaneous claim actors (Q62 shape: 20)"
        required: false
        default: "20"
      rounds:
        description: "Claim bursts per actor"
        required: false
        default: "3"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('{0}-dispatch-{1}', github.workflow, github.run_id) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  presence-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci # the soak boots the real server in-process, so it needs installed deps
      - name: presence-under-claim-load soak (bounded)
        env:
          C43_ACTORS: ${{ inputs.actors || '20' }}
          C43_ROUNDS: ${{ inputs.rounds || '3' }}
          C43_BUDGET_MS: "240000"
        run: node --test tests/presence-claim-soak.test.js
