name: test

# W4-C settle harness (branch jill/w4c-f7f8-settle-1ab906c3 only; main's
# test.yml is untouched). Dispatch-only. Checks out the exact pin
# 1ab906c37b5c5bdfe07f1b12808c8855128a713f and runs the MAIN-HEALTH
# charter step-0 settles standalone and sequentially on this hosted
# runner: F7 (tests/access-review.test.js) x5, then F8
# (tests/agent-autonomy-client.test.js) x2. Per-run TAP counts and any
# "not ok" lines are printed to the job log; the step never aborts on a
# test failure, so all seven runs always execute. The job conclusion is
# NOT the verdict — the per-run TAP counts in the log are.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settle-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 1ab906c37b5c5bdfe07f1b12808c8855128a713f
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify pin tree and runner load
        run: |
          echo "HEAD: $(git rev-parse HEAD)"
          echo "status-porcelain-lines: $(git status --porcelain | wc -l)"
          echo "loadavg: $(cat /proc/loadavg)"
          echo "nproc: $(nproc)"
          node --version
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: F7 standalone x5, F8 standalone x2 (sequential)
        run: |
          mkdir -p /tmp/settle-logs /tmp/settle-tmp
          export TMPDIR=/tmp/settle-tmp
          run_one() {
            tag="$1"; file="$2"
            echo "===== ${tag} load-at-start: $(cat /proc/loadavg)"
            start=$(date +%s)
            node --test "$file" > "/tmp/settle-logs/${tag}.log" 2>&1 && rc=0 || rc=$?
            dur=$(( $(date +%s) - start ))
            echo "===== ${tag} exit=${rc} duration=${dur}s"
            grep -E "^# (tests|suites|pass|fail|cancelled)" "/tmp/settle-logs/${tag}.log" || true
            grep -E "^not ok" "/tmp/settle-logs/${tag}.log" || true
            echo "----- full TAP for ${tag} -----"
            cat "/tmp/settle-logs/${tag}.log"
            echo "----- end ${tag} -----"
            return 0
          }
          run_one f7-run1 tests/access-review.test.js
          run_one f7-run2 tests/access-review.test.js
          run_one f7-run3 tests/access-review.test.js
          run_one f7-run4 tests/access-review.test.js
          run_one f7-run5 tests/access-review.test.js
          run_one f8-run1 tests/agent-autonomy-client.test.js
          run_one f8-run2 tests/agent-autonomy-client.test.js
          echo "final HEAD: $(git rev-parse HEAD)"
          echo "final status-porcelain-lines: $(git status --porcelain | wc -l)"
          echo "final loadavg: $(cat /proc/loadavg)"
