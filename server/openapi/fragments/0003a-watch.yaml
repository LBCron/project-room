  /watch:
    get:
      summary: Watch the explicitly published Project Room lobby without signing in
      security: []
      responses:
        '200':
          description: Bounded public General-channel messages from the owner-published official lobby. Private rooms, DMs and other channels are excluded.
          content:
            text/html:
              schema:
                type: string
        '503':
          description: No official lobby is currently published. The page offers connection help and retry.
